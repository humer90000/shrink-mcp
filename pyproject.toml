[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shrink"
version = "0.4.2"
description = "Fewer tokens for coding agents. Shrink git diffs, test logs, and repo trees. MCP for Cursor, Claude Code, Codex, and VS Code."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "humer90000" }]

[project.optional-dependencies]
# plain install stays stdlib. this extra makes the token line match cl100k
tokens = ["tiktoken"]

[project.scripts]
shrink = "shrink:main"

[tool.setuptools]
py-modules = ["shrink"]
license-files = ["LICENSE"]
